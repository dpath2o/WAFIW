[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-antarctic-fast-ice-watch"
version = "0.1.0"
description = "Laptop-first Antarctic fast-ice research workflows"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "rasterio>=1.3", "pyproj>=3.6", "shapely>=2", "scikit-image>=0.22", "scikit-learn>=1.4", "joblib>=1.3", "matplotlib>=3.8", "Pillow>=10", "PyYAML>=6", "reportlab>=4", "asf-search>=8"]

[project.optional-dependencies]
test = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]
sam = ["torch>=2.2", "torchvision>=0.17", "segment-anything>=1.0", "opencv-python-headless>=4.9"]

[project.scripts]
afiw-primary = "afiw.cli:primary_main"
afiw-bulletin = "afiw.cli:bulletin_main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
